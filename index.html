<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Party Time</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Party Time">
<meta name="theme-color" content="#FFFDF9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    /* cores tiradas do logótipo */
    --ink:#2E3A4B;
    --muted:#8A93A3;
    --bg:#FFFDF9;
    --paper:#FFFFFF;
    --line:#EFE9E1;
    --soft:#F7F3EE;
    --pink:#FF8F9B;
    --orange:#F8AE3E;
    --yellow:#FFCC60;
    --mint:#A9E0D4;
    --green:#7ECBB0;
    --purple:#C99DD2;
    --radius:18px;
    --shadow:0 1px 2px rgba(46,58,75,.04),0 4px 14px rgba(46,58,75,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Nunito",ui-rounded,"Segoe UI Rounded",system-ui,sans-serif;font-weight:600;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) 16px 70px;
  }
  .wrap{max-width:760px;margin:0 auto}
  h2,h3,.tab,.btn-cta,.stat .num{font-family:"Fredoka","Nunito",system-ui,sans-serif;font-weight:600}

  /* ---------- cabeçalho ---------- */
  header.hero{position:relative;padding:22px 0 4px;text-align:center}
  .logo{width:150px;max-width:42vw;display:block;margin:0 auto}
  .top-actions{position:absolute;top:22px;right:0}

  /* ---------- separadores (controlo segmentado) ---------- */
  nav.tabs{display:flex;gap:4px;margin:18px auto 24px;padding:4px;background:var(--soft);border-radius:999px;max-width:520px}
  @media (max-width:480px){nav.tabs .tab{font-size:14px;padding:9px 4px}}
  .tab{
    flex:1;font-size:16px;cursor:pointer;color:var(--muted);
    background:transparent;border:0;border-radius:999px;padding:9px 12px;transition:background .2s,color .2s;
  }
  .tab[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(46,58,75,.12)}
  button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--mint);outline-offset:2px}

  /* ---------- botões ---------- */
  .btn-cta{
    font-size:16px;cursor:pointer;background:var(--ink);color:#fff;border:0;border-radius:999px;
    padding:12px 22px;white-space:nowrap;transition:transform .1s,opacity .2s;
  }
  .btn-cta:active{transform:scale(.97)}
  .btn-cta.full{width:100%}
  .btn-cta:disabled{opacity:.5;cursor:default}
  .back-btn{
    font:inherit;font-size:14px;font-weight:700;cursor:pointer;background:transparent;color:var(--muted);
    border:0;border-radius:999px;padding:6px 10px;
  }
  .back-btn:hover{color:var(--ink);background:var(--soft)}

  /* ---------- cartões e formulários ---------- */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:28px}
  .card h2{font-size:18px;margin:0 0 14px}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  h2{font-size:20px;margin:0}
  .grid{display:grid;grid-template-columns:1fr;gap:12px}
  .form-row{display:grid;gap:10px;align-items:end}
  .form-row.guests{grid-template-columns:2fr 1fr auto}
  .form-row.food{grid-template-columns:2fr 1fr 1.4fr auto}
  .form-row.todo{grid-template-columns:2fr 1.2fr auto}
  @media (max-width:640px){
    .form-row.guests,.form-row.food,.form-row.todo{grid-template-columns:1fr}
    .form-row .btn-cta{width:100%}
  }
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 5px}
  input{
    width:100%;font-family:inherit;font-weight:600;font-size:16px;color:var(--ink);
    background:var(--soft);border:1px solid transparent;border-radius:12px;padding:11px 13px;transition:border-color .2s,background .2s;
  }
  input:focus{background:var(--paper);border-color:var(--mint);outline:none}
  input::placeholder{color:#B5BCC7}
  select{
    width:100%;font-family:inherit;font-weight:600;font-size:16px;color:var(--ink);
    background:var(--soft) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%238A93A3'><path d='M5 8l5 5 5-5z'/></svg>") no-repeat right 10px center/18px;
    border:1px solid transparent;border-radius:12px;padding:11px 36px 11px 13px;appearance:none;-webkit-appearance:none
  }
  select:focus{background-color:var(--paper);border-color:var(--mint);outline:none}
  .grid.two{grid-template-columns:1fr 1fr}
  .grid .full{grid-column:1/-1}
  @media (max-width:560px){.grid.two{grid-template-columns:1fr}}
  input.invalid{border-color:var(--pink);background:#FFF5F6}
  .login-error{display:none;background:#FFE9EC;color:#B4485A;border-radius:12px;padding:9px 12px;font-size:14px;text-align:center}

  /* ---------- resumo ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
  .stat{padding:14px 14px 12px;background:var(--paper)}
  .stat .num{display:flex;align-items:center;gap:7px;font-size:24px;line-height:1}
  .stat .num::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tone,var(--mint))}
  .stat .lbl{display:block;font-size:12px;color:var(--muted);margin-top:5px;font-weight:700}
  @media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}

  /* ---------- filtros ---------- */
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .chip{
    font:inherit;font-size:13px;font-weight:700;cursor:pointer;
    background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 13px;color:var(--muted);
  }
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

  /* ---------- itens ---------- */
  .pill{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--tint,var(--soft));color:var(--ink)}
  .pill.plain{background:var(--soft);color:var(--muted)}
  .del,.edit{
    position:absolute;top:10px;width:26px;height:26px;border-radius:50%;
    border:0;background:transparent;color:#B5BCC7;cursor:pointer;
    font-size:15px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0
  }
  .del{right:8px}
  .edit{right:36px;font-size:13px}
  .del:hover{background:#FFE9EC;color:#B4485A}
  .edit:hover{background:var(--soft);color:var(--ink)}

  /* ---------- convidados ---------- */
  .stepper{display:flex;align-items:center;gap:2px;flex:none}
  .step{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);
    font-size:15px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
  .step:disabled{opacity:.35;cursor:default}
  .step:not(:disabled):hover{background:var(--soft)}
  .stepper .count{font-family:"Fredoka",sans-serif;font-size:15px;min-width:28px;text-align:center}
  .toggle{
    flex:none;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;line-height:1;
    background:var(--soft);color:var(--muted);border:0;border-radius:999px;padding:7px 11px;transition:background .2s,color .2s;
  }
  .toggle.sent[aria-pressed="true"]{background:#DDF3EE;color:#2F7A6A}
  .toggle.conf[aria-pressed="true"]{background:#FFE4CC;color:#A55E10}
  .toggle.decl[aria-pressed="true"]{background:#FFE9EC;color:#B4485A}
  .task.guest.declined .txt{color:#B5BCC7;text-decoration:line-through}
  .task.guest .txt[data-gedit]{cursor:pointer}
  .task .ctrls{display:flex;align-items:center;gap:8px;flex:none}
  .task.guest .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toggle .sm{display:none}
  /* telemóvel: tudo numa linha, botões passam a ícones */
  @media (max-width:600px){
    .task.guest{gap:6px;padding-left:12px;padding-right:6px}
    .task.guest .ctrls{gap:6px}
    .task.guest .toggles-row{gap:4px !important}
    .toggle{width:30px;height:30px;padding:0;display:grid;place-items:center;font-size:14px}
    .toggle .lg{display:none}
    .toggle .sm{display:inline}
    .stepper .count{min-width:24px}
    .step{width:24px;height:24px}
    .task.guest .edit{display:none}
    .task.guest .del{width:24px}
  }

  /* ---------- to do ---------- */
  .task-list{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .task{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-top:1px solid var(--line)}
  .task:first-child{border-top:0}
  .check{
    flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #D6DBE2;background:var(--paper);
    cursor:pointer;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;padding:0;transition:background .2s,border-color .2s
  }
  .check[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
  .task .txt{flex:1;font-size:15px;font-weight:600;overflow-wrap:anywhere}
  .task.done .txt{text-decoration:line-through;color:#B5BCC7}
  .task .del,.task .edit{position:static;flex:none}
  .task .edit + .del{margin-left:-8px}
  .task .txt .qty{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:1px}
  .task.done .txt .qty{color:#C9CED6}
  .task .who{
    flex:none;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;border:0;border-radius:999px;padding:4px 10px;
    background:var(--tint,var(--soft));color:var(--ink);max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
  }
  .task .who.none{background:transparent;color:#B5BCC7;border:1px dashed #D6DBE2}
  .task .who:hover{filter:brightness(.96)}
  span.who{cursor:default}
  span.who:hover{filter:none}
  .task .value{flex:none;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
  .task.done .value{color:#B5BCC7}
  @media (max-width:600px){
    .task.gift{flex-wrap:wrap;row-gap:6px}
    .task.gift .txt{flex:1 1 0;min-width:0}
    .task.gift .ctrls{order:3;flex-basis:100%;padding-left:36px}
  }
  .task.done .who{opacity:.5}
  .progress{height:6px;border-radius:999px;background:var(--soft);overflow:hidden;margin:0 0 14px}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--pink),var(--yellow),var(--green));width:0;transition:width .3s}
  #todo-count,#food-count,#guest-count,#gift-count{background:transparent;padding:0;color:var(--muted)}

  /* ---------- prendas ---------- */
  .totals-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;
    margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .totals-head .amount{font-family:"Fredoka",sans-serif;font-weight:600;font-size:26px}
  .totals .lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .totals-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
  .buyer-row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:14px;font-weight:700}
  .buyer-row span:last-child{font-variant-numeric:tabular-nums}
  .cat-name{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#B5BCC7;margin:6px 0 1px}
  .cat-group:first-child .cat-name{margin-top:0}
  .totals-empty{margin:0;font-size:13px;color:#B5BCC7}
  .empty-note{border:1.5px dashed var(--line);border-radius:var(--radius);padding:26px 18px;text-align:center;color:var(--muted);font-size:14px}
  .empty-note strong{display:block;font-family:"Fredoka",sans-serif;font-weight:600;font-size:17px;color:var(--ink);margin-bottom:4px}
  .hidden{display:none !important}
  .boot-error{display:none;background:#FFE9EC;color:#B4485A;font-weight:700;border-radius:12px;padding:10px 14px;margin:16px 0;text-align:center}
  footer{text-align:center;color:#C3C9D2;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:34px 0 10px}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <img class="logo" src="icons/logo.png" alt="It's party time">
    <div class="top-actions hidden" id="top-actions">
      <button class="back-btn" id="logout-btn">Sair</button>
    </div>
  </header>

  <div id="boot-error" class="boot-error"></div>

  <!-- ======== LOGIN ======== -->
  <div id="login-screen" class="hidden">
    <div class="card" style="max-width:360px;margin:20px auto">
      <h2 style="text-align:center">Entrar</h2>
      <form class="grid" id="login-form">
        <div>
          <label for="login-user">Utilizador (email)</label>
          <input id="login-user" type="email" autocomplete="username" placeholder="familia@exemplo.com">
        </div>
        <div>
          <label for="login-pass">Palavra-passe</label>
          <input id="login-pass" type="password" autocomplete="current-password" placeholder="••••••••">
        </div>
        <div id="login-error" class="login-error"></div>
        <button class="btn-cta full" id="login-btn" type="submit">Entrar</button>
      </form>
    </div>
  </div>

  <!-- ======== APP (só visível depois de entrar) ======== -->
  <div id="app-content" class="hidden">

  <nav class="tabs" role="tablist" aria-label="Secções">
    <button class="tab" role="tab" id="tab-guests" aria-selected="true" data-view="guests">Convidados</button>
    <button class="tab" role="tab" id="tab-food" aria-selected="false" data-view="food">Comida</button>
    <button class="tab" role="tab" id="tab-todo" aria-selected="false" data-view="todo">To do</button>
    <button class="tab" role="tab" id="tab-gifts" aria-selected="false" data-view="gifts">Prendas</button>
  </nav>

  <!-- ======== CONVIDADOS ======== -->
  <section id="view-guests" role="tabpanel" aria-labelledby="tab-guests">
    <div class="stats" id="guest-stats"></div>

    <div class="card">
      <h2>Novo convidado</h2>
      <form class="form-row guests" id="guest-form" autocomplete="off">
        <div>
          <label for="g-name">Nome</label>
          <input id="g-name" placeholder="Maria Silva" required>
        </div>
        <div>
          <label for="g-plus">Acompanhantes (+1)</label>
          <input id="g-plus" type="number" min="0" step="1" value="0" inputmode="numeric">
        </div>
        <button class="btn-cta" type="submit">Adicionar</button>
      </form>
    </div>

    <div class="section-head">
      <h2>Lista de convidados</h2>
      <span class="pill plain" id="guest-count"></span>
    </div>
    <div class="progress" aria-hidden="true"><div id="guest-bar"></div></div>
    <div class="filters" id="guest-filter">
      <button class="chip" data-f="all" aria-pressed="true">Todos</button>
      <button class="chip" data-f="unsent" aria-pressed="false">Por enviar</button>
      <button class="chip" data-f="sent" aria-pressed="false">Enviados</button>
      <button class="chip" data-f="conf" aria-pressed="false">Confirmados</button>
      <button class="chip" data-f="decl" aria-pressed="false">Recusados</button>
    </div>
    <div id="guest-items"></div>
  </section>

  <!-- ======== COMIDA ======== -->
  <section id="view-food" role="tabpanel" aria-labelledby="tab-food" class="hidden">
    <div class="card">
      <h2 id="f-form-title">Novo item</h2>
      <form class="form-row food" id="food-form" autocomplete="off">
        <div>
          <label for="f-name">Item</label>
          <input id="f-name" placeholder="Pão de forma" required>
        </div>
        <div>
          <label for="f-qty">Quantidade</label>
          <input id="f-qty" placeholder="2 pacotes">
        </div>
        <div>
          <label for="f-who">Responsável</label>
          <input id="f-who" placeholder="João" list="people">
        </div>
        <button class="btn-cta" type="submit" id="f-save">Adicionar</button>
      </form>
      <datalist id="people"></datalist>
    </div>

    <div class="section-head">
      <h2>Itens</h2>
      <span class="pill plain" id="food-count"></span>
    </div>
    <div class="progress" aria-hidden="true"><div id="food-bar"></div></div>
    <div class="filters" id="food-filter"></div>
    <div id="food-items"></div>
  </section>

  <!-- ======== TO DO ======== -->
  <section id="view-todo" role="tabpanel" aria-labelledby="tab-todo" class="hidden">
    <div class="card">
      <h2>Nova tarefa</h2>
      <form class="form-row todo" id="todo-form" autocomplete="off">
        <div>
          <label for="t-text">Tarefa</label>
          <input id="t-text" placeholder="Comprar balões" required>
        </div>
        <div>
          <label for="t-who">Responsável</label>
          <input id="t-who" placeholder="Ana" list="people">
        </div>
        <button class="btn-cta" type="submit">Adicionar</button>
      </form>
    </div>

    <div class="section-head">
      <h2>Tarefas</h2>
      <span class="pill plain" id="todo-count"></span>
    </div>
    <div class="progress" aria-hidden="true"><div id="todo-bar"></div></div>
    <div class="filters" id="todo-filter"></div>
    <div id="todo-items"></div>
  </section>

  <!-- ======== PRENDAS (igual à Kitty Quest) ======== -->
  <section id="view-gifts" role="tabpanel" aria-labelledby="tab-gifts" class="hidden">

    <!-- ecrã 1: listagem -->
    <div id="gifts-list">
      <div class="section-head">
        <h2>Prendas</h2>
        <button class="btn-cta" id="go-add-gift">Nova prenda</button>
      </div>
      <div class="card totals">
        <div class="totals-head">
          <span class="lbl" style="margin:0">Total por saldar</span>
          <span class="amount" id="gifts-total"></span>
        </div>
        <div class="totals-grid">
          <div>
            <span class="lbl">Quem compra</span>
            <div id="gifts-by-buyer"></div>
          </div>
          <div>
            <span class="lbl">Quem dá</span>
            <div id="gifts-by-giver"></div>
          </div>
          <div>
            <span class="lbl">Para quem</span>
            <div id="gifts-by-recipient"></div>
          </div>
        </div>
      </div>
      <div class="section-head">
        <h2>Lista</h2>
        <span class="pill plain" id="gift-count"></span>
      </div>
      <div class="progress" aria-hidden="true"><div id="gift-bar"></div></div>
      <div id="gifts-items"></div>
    </div>

    <!-- ecrã 2: nova prenda -->
    <div id="gift-add" class="hidden">
      <button class="back-btn" id="gift-add-back" style="margin:0 0 10px -10px">‹ Voltar</button>
      <div class="card">
        <h2>Nova prenda</h2>
        <form class="grid two" id="gift-form" autocomplete="off">
          <div class="full">
            <label for="g-item">Item</label>
            <input id="g-item" placeholder="Bicicleta">
          </div>
          <div>
            <label for="g-recipient">Para quem</label>
            <input id="g-recipient" placeholder="Nome" list="people">
          </div>
          <div>
            <label for="g-cat">Categoria</label>
            <select id="g-cat"></select>
          </div>
          <div>
            <label for="g-buyer">Quem compra</label>
            <input id="g-buyer" placeholder="Nome" list="people">
          </div>
          <div>
            <label for="g-giver">Quem dá</label>
            <input id="g-giver" placeholder="Nome" list="people">
          </div>
          <div>
            <label for="g-value">Valor (€)</label>
            <input id="g-value" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
          </div>
          <div class="full" style="text-align:right">
            <button class="btn-cta" id="g-save" type="submit">Guardar prenda</button>
          </div>
        </form>
      </div>
    </div>

  </section>

  <footer>Convidar · Comer · Celebrar</footer>
  </div><!-- /app-content -->
</div>

<script>
/* ---------------- proteção contra ecrã em branco ---------------- */
window.addEventListener("error", e=>{
  const bar = document.getElementById("boot-error");
  if(bar){ bar.style.display="block"; bar.textContent = "Ups! Algo correu mal: " + (e.message||e); }
});

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TONES = ["var(--pink)","var(--mint)","var(--green)","var(--purple)","var(--yellow)","var(--orange)"];
const toneFor = s => { let h=0; for(const ch of String(s||"")) h=(h*31+ch.charCodeAt(0))>>>0; return TONES[h%TONES.length]; };

const SUPABASE_URL = "https://nvbsddegwrfehvyclpsd.supabase.co";
const SUPABASE_KEY = "sb_publishable_USK5NaKdSEoFQnROFr3fXg_gYb00Tsg";

/* ---------------- dados (guardados no Supabase, não no dispositivo) ---------------- */
const TABLES = { guests:"pt_guests", food:"pt_food", todos:"pt_todos", gifts:"pt_gifts" };
const emptyData = () => ({ guests:[], food:[], todos:[], gifts:[] });
let data = emptyData();

async function fetchAll(){
  if(!supa) return;
  const res = await Promise.all(Object.values(TABLES).map(t=>
    supa.from(t).select("*").order("created_at", {ascending:true})));
  Object.keys(TABLES).forEach((k,i)=>{
    if(res[i].error) console.error(res[i].error);
    else data[k] = res[i].data || [];
  });
  renderAll();
}

// executa a operação na base de dados; se falhar avisa e volta a carregar o estado real
async function db(op, failMsg){
  const { error } = await op;
  if(error){ alert(failMsg + ": " + error.message); await fetchAll(); return false; }
  return true;
}
async function insertRow(kind, row){
  const { data:rows, error } = await supa.from(TABLES[kind]).insert(row).select();
  if(error){ alert("Não foi possível guardar: " + error.message); return false; }
  data[kind].push(rows[0]);
  return true;
}
const updateRow = (kind, id, patch) => db(supa.from(TABLES[kind]).update(patch).eq("id", id), "Não foi possível atualizar");
const deleteRow = (kind, id) => db(supa.from(TABLES[kind]).delete().eq("id", id), "Não foi possível apagar");

/* ================= CONVIDADOS ================= */
let guestFilter = "all";

function renderGuests(){
  const g = data.guests;
  const people = g.reduce((n,x)=>n+1+(x.plus||0), 0);
  const sent = g.filter(x=>x.sent).length;
  const heads = list => list.reduce((n,x)=>n+1+(x.plus||0), 0);  // conta o convidado e os acompanhantes
  const confGuests = g.filter(x=>x.confirmed);
  const confPeople = heads(confGuests);
  const declPeople = heads(g.filter(x=>x.declined));
  $("#guest-stats").innerHTML = [
    {n:g.length,   l:"Convidados",          t:"var(--pink)"},
    {n:people,     l:"Pessoas (com +1)",    t:"var(--yellow)"},
    {n:sent,       l:"Convites enviados",   t:"var(--mint)"},
    {n:confPeople, l:"Pessoas confirmadas", t:"var(--orange)"},
    {n:declPeople, l:"Pessoas recusaram",   t:"var(--purple)"},
    {n:people-confPeople-declPeople, l:"Pessoas por responder", t:"#D6DBE2"}
  ].map(s=>`<div class="stat" style="--tone:${s.t}"><span class="num">${s.n}</span><span class="lbl">${s.l}</span></div>`).join("");

  $("#guest-count").textContent = `${confGuests.length} de ${g.length} confirmados`;
  $("#guest-bar").style.width = g.length ? (confGuests.length/g.length*100)+"%" : "0";

  const list = g.filter(x=>
    guestFilter==="all" ? true :
    guestFilter==="unsent" ? !x.sent :
    guestFilter==="sent" ? x.sent :
    guestFilter==="decl" ? x.declined : x.confirmed);

  $("#guest-items").innerHTML = list.length
    ? `<ul class="task-list">${list.map(guestRow).join("")}</ul>`
    : g.length
      ? `<div class="empty-note"><strong>Ninguém aqui</strong>Nenhum convidado corresponde a este filtro.</div>`
      : `<div class="empty-note"><strong>Ainda não há convidados</strong>Adiciona o primeiro nome acima para começar a lista.</div>`;
}

function guestRow(x){
  const plus = x.plus||0;
  return `<li class="task guest ${x.declined?"declined":""}">
    <span class="txt" data-gedit="${x.id}" title="Editar nome">${esc(x.name)}</span>
    <div class="ctrls">
      <span class="stepper" title="Acompanhantes">
        <button class="step" data-gplus="${x.id}" data-d="-1" ${plus<=0?"disabled":""} aria-label="Menos um acompanhante">−</button>
        <span class="count" aria-label="${plus} acompanhantes">+${plus}</span>
        <button class="step" data-gplus="${x.id}" data-d="1" aria-label="Mais um acompanhante">+</button>
      </span>
      <span class="toggles-row" style="display:flex;gap:6px">
        <button class="toggle sent" data-gsent="${x.id}" aria-pressed="${!!x.sent}" aria-label="Convite enviado" title="Convite enviado"><span class="lg">${x.sent?"Enviado ✓":"Enviado"}</span><span class="sm" aria-hidden="true">✉</span></button>
        <button class="toggle conf" data-gconf="${x.id}" aria-pressed="${!!x.confirmed}" aria-label="Confirmado" title="Confirmado"><span class="lg">${x.confirmed?"Confirmado ✓":"Confirmado"}</span><span class="sm" aria-hidden="true">✓</span></button>
        <button class="toggle decl" data-gdecl="${x.id}" aria-pressed="${!!x.declined}" aria-label="Recusado" title="Recusado"><span class="lg">${x.declined?"Recusado ✓":"Recusado"}</span><span class="sm" aria-hidden="true">⊘</span></button>
      </span>
    </div>
    <button class="edit" data-gedit="${x.id}" aria-label="Editar nome de ${esc(x.name)}">✎</button>
    <button class="del" data-gdel="${x.id}" aria-label="Apagar ${esc(x.name)}">×</button>
  </li>`;
}

$("#guest-form").onsubmit = async e=>{
  e.preventDefault();
  const name = $("#g-name").value.trim();
  if(!name) return;
  const plus = Math.max(0, parseInt($("#g-plus").value,10) || 0);
  const btn = e.submitter; if(btn) btn.disabled = true;
  const ok = await insertRow("guests", {name, plus});
  if(btn) btn.disabled = false;
  if(!ok) return;
  renderGuests();
  $("#g-name").value = ""; $("#g-plus").value = "0"; $("#g-name").focus();
};

$("#guest-filter").onclick = e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  guestFilter = b.dataset.f;
  document.querySelectorAll("#guest-filter .chip").forEach(c=>c.setAttribute("aria-pressed", String(c===b)));
  renderGuests();
};

$("#guest-items").onclick = e=>{
  const b = e.target.closest("button, [data-gedit]"); if(!b) return;
  const find = id => data.guests.find(x=>x.id===id);
  // atualiza já no ecrã e grava em segundo plano
  const patch = (x, p) => { Object.assign(x, p); renderGuests(); updateRow("guests", x.id, p); };
  if(b.dataset.gplus){
    const x = find(b.dataset.gplus);
    patch(x, {plus: Math.max(0, (x.plus||0) + Number(b.dataset.d))});
  } else if(b.dataset.gsent){
    const x = find(b.dataset.gsent);
    patch(x, {sent: !x.sent});
  } else if(b.dataset.gconf){
    const x = find(b.dataset.gconf);
    // quem confirmou recebeu o convite
    patch(x, x.confirmed ? {confirmed:false} : {confirmed:true, declined:false, sent:true});
  } else if(b.dataset.gdecl){
    const x = find(b.dataset.gdecl);
    // confirmado e recusado excluem-se; quem recusou também recebeu o convite
    patch(x, x.declined ? {declined:false} : {declined:true, confirmed:false, sent:true});
  } else if(b.dataset.gedit){
    const x = find(b.dataset.gedit);
    const name = prompt("Nome do convidado", x.name);
    if(name===null || !name.trim()) return;
    patch(x, {name: name.trim()});
  } else if(b.dataset.gdel){
    const x = find(b.dataset.gdel);
    if(!confirm(`Apagar ${x.name}?`)) return;
    data.guests = data.guests.filter(y=>y.id!==x.id);
    renderGuests(); deleteRow("guests", x.id);
  }
};

/* ---------------- responsáveis (partilhados entre Comida e To do) ---------------- */
const namesOf = list => [...new Set(list.map(x=>x.who).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt"));
const tint = w => `color-mix(in srgb, ${toneFor(w)} 28%, white)`;
function renderPeopleList(){
  $("#people").innerHTML = namesOf([...data.food, ...data.todos]).map(w=>`<option value="${esc(w)}">`).join("");
}
// botões de filtro por responsável; devolve o filtro válido
function renderWhoChips(box, list, current){
  const who = namesOf(list);
  if(current!=="all" && current!=="none" && !who.includes(current)) current = "all";
  const chips = [{f:"all",l:"Todos"}, ...who.map(w=>({f:w,l:w}))];
  if(list.some(x=>!x.who)) chips.push({f:"none",l:"Sem responsável"});
  box.innerHTML = list.length && who.length ? chips.map(c=>
    `<button class="chip" data-f="${esc(c.f)}" aria-pressed="${current===c.f}">${esc(c.l)}</button>`).join("") : "";
  return current;
}
const matchWho = (x, f) => f==="all" ? true : f==="none" ? !x.who : x.who===f;

/* ================= COMIDA ================= */
let foodFilter = "all";
let editingFoodId = null;

function renderFood(){
  renderPeopleList();
  foodFilter = renderWhoChips($("#food-filter"), data.food, foodFilter);
  const list = data.food.filter(f=>matchWho(f, foodFilter));
  const ready = data.food.filter(f=>f.done).length;
  $("#food-count").textContent = `${ready} de ${data.food.length} prontos`;
  $("#food-bar").style.width = data.food.length ? (ready/data.food.length*100)+"%" : "0";
  // por tratar primeiro, prontos no fim
  const sorted = [...list.filter(f=>!f.done), ...list.filter(f=>f.done)];
  $("#food-items").innerHTML = sorted.length
    ? `<ul class="task-list">${sorted.map(foodRow).join("")}</ul>`
    : `<div class="empty-note"><strong>Ainda não há itens</strong>Adiciona o que é preciso, quanto e quem trata disso.</div>`;
}

function foodRow(f){
  return `<li class="task ${f.done?"done":""}">
    <button class="check" data-fdone="${f.id}" aria-pressed="${!!f.done}" aria-label="Marcar ${esc(f.name)} como pronto">${f.done?"✓":""}</button>
    <span class="txt">${esc(f.name)}${f.qty?`<span class="qty">${esc(f.qty)}</span>`:""}</span>
    ${f.who
      ? `<button class="who" data-fwho="${f.id}" style="--tint:${tint(f.who)}" aria-label="Responsável: ${esc(f.who)} (alterar)">${esc(f.who)}</button>`
      : `<button class="who none" data-fwho="${f.id}" aria-label="Atribuir responsável">+ Responsável</button>`}
    <button class="edit" data-fedit="${f.id}" aria-label="Editar ${esc(f.name)}">✎</button>
    <button class="del" data-fdel="${f.id}" aria-label="Apagar ${esc(f.name)}">×</button>
  </li>`;
}

function resetFoodForm(){
  editingFoodId = null;
  $("#f-name").value = $("#f-qty").value = $("#f-who").value = "";
  $("#f-form-title").textContent = "Novo item";
  $("#f-save").textContent = "Adicionar";
}

$("#food-form").onsubmit = async e=>{
  e.preventDefault();
  const name = $("#f-name").value.trim();
  if(!name) return;
  const item = { name, qty:$("#f-qty").value.trim()||null, who:$("#f-who").value.trim()||null };
  $("#f-save").disabled = true;
  let ok;
  if(editingFoodId){
    ok = await updateRow("food", editingFoodId, item);
    if(ok) Object.assign(data.food.find(f=>f.id===editingFoodId) || {}, item);
  } else {
    ok = await insertRow("food", item);
  }
  $("#f-save").disabled = false;
  if(!ok) return;
  resetFoodForm(); renderFood(); $("#f-name").focus();
};

$("#food-filter").onclick = e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  foodFilter = b.dataset.f; renderFood();
};

$("#food-items").onclick = e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.fdone){
    const f = data.food.find(x=>x.id===b.dataset.fdone);
    f.done = !f.done;
    renderFood(); updateRow("food", f.id, {done:f.done});
  } else if(b.dataset.fwho){
    const f = data.food.find(x=>x.id===b.dataset.fwho);
    const who = prompt(`Responsável por "${f.name}" (deixa vazio para nenhum)`, f.who||"");
    if(who===null) return;
    f.who = who.trim() || null;
    if(editingFoodId===f.id) $("#f-who").value = f.who||"";
    renderFood(); updateRow("food", f.id, {who:f.who});
  } else if(b.dataset.fedit){
    const f = data.food.find(x=>x.id===b.dataset.fedit);
    editingFoodId = f.id;
    $("#f-name").value = f.name; $("#f-qty").value = f.qty||""; $("#f-who").value = f.who||"";
    $("#f-form-title").textContent = "Editar item";
    $("#f-save").textContent = "Guardar";
    $("#food-form").scrollIntoView({behavior:"smooth", block:"center"});
    $("#f-name").focus({preventScroll:true});
  } else if(b.dataset.fdel){
    const f = data.food.find(x=>x.id===b.dataset.fdel);
    if(!confirm(`Apagar ${f.name}?`)) return;
    data.food = data.food.filter(x=>x.id!==f.id);
    if(editingFoodId===f.id) resetFoodForm();
    renderFood(); deleteRow("food", f.id);
  }
};

/* ================= TO DO ================= */
let todoFilter = "all";

function renderTodos(){
  renderPeopleList();
  todoFilter = renderWhoChips($("#todo-filter"), data.todos, todoFilter);
  const t = data.todos;
  const done = t.filter(x=>x.done).length;
  $("#todo-count").textContent = `${done} de ${t.length} feitas`;
  $("#todo-bar").style.width = t.length ? (done/t.length*100)+"%" : "0";
  // por fazer primeiro, feitas no fim
  const shown = t.filter(x=>matchWho(x, todoFilter));
  const list = [...shown.filter(x=>!x.done), ...shown.filter(x=>x.done)];
  $("#todo-items").innerHTML = list.length
    ? `<ul class="task-list">${list.map(x=>`
      <li class="task ${x.done?"done":""}">
        <button class="check" data-tdone="${x.id}" aria-pressed="${!!x.done}" aria-label="Marcar ${esc(x.text)} como feita">${x.done?"✓":""}</button>
        <span class="txt">${esc(x.text)}</span>
        ${x.who
          ? `<button class="who" data-twho="${x.id}" style="--tint:${tint(x.who)}" aria-label="Responsável: ${esc(x.who)} (alterar)">${esc(x.who)}</button>`
          : `<button class="who none" data-twho="${x.id}" aria-label="Atribuir responsável">+ Responsável</button>`}
        <button class="del" data-tdel="${x.id}" aria-label="Apagar ${esc(x.text)}">×</button>
      </li>`).join("")}</ul>`
    : `<div class="empty-note"><strong>Nada por fazer… por agora</strong>Adiciona a primeira tarefa da festa.</div>`;
}

$("#todo-form").onsubmit = async e=>{

$("#todo-items").onclick = e=>{

  if(b.dataset.tdone){
    const x = data.todos.find(y=>y.id===b.dataset.tdone);

$("#todo-filter").onclick = e=>{
  const b = e.target.closest(".chip"); if(!b) return;

/* ================= PRENDAS (copiado da Kitty Quest) ================= */
const GIFT_CATS = [
  {id:"aniversario", label:"Aniversário", tone:"var(--pink)"},
  {id:"natal",       label:"Natal",       tone:"var(--green)"}
];
const giftCat = id => GIFT_CATS.find(c=>c.id===id) || GIFT_CATS[0];
const formatEuro = v => (Number(v)||0).toLocaleString("pt-PT", {style:"currency", currency:"EUR"});
const GIFT_FIELDS = ["#g-item","#g-recipient","#g-buyer","#g-giver","#g-value"];
$("#g-cat").innerHTML = GIFT_CATS.map(c=>`<option value="${c.id}">${c.label}</option>`).join("");

function showGiftsScreen(name){
  $("#gifts-list").classList.toggle("hidden", name!=="list");
  $("#gift-add").classList.toggle("hidden", name!=="add");
}
$("#go-add-gift").onclick = () => {
  GIFT_FIELDS.forEach(f=>$(f).value="");
  $("#g-item").classList.remove("invalid");
  $("#g-cat").value = GIFT_CATS[0].id;
  showGiftsScreen("add");
  $("#g-item").focus();
};
$("#gift-add-back").onclick = () => showGiftsScreen("list");

function giftRow(g){
  const c = giftCat(g.category);
  const sub = [g.recipient&&`Para ${g.recipient}`, g.buyer&&`Compra: ${g.buyer}`, g.giver&&`Dá: ${g.giver}`].filter(Boolean).join(" · ");
  return `<li class="task gift ${g.settled?"done":""}">
    <button class="check" data-settle="${g.id}" aria-pressed="${!!g.settled}" aria-label="Marcar ${esc(g.item)} como saldada">${g.settled?"✓":""}</button>
    <span class="txt">${esc(g.item)}${sub?`<span class="qty">${esc(sub)}</span>`:""}</span>
    <span class="ctrls">
      <span class="who" style="--tint:color-mix(in srgb, ${c.tone} 28%, white)">${c.label}</span>
      <span class="value">${formatEuro(g.value)}</span>
    </span>
    <button class="del" data-gfdel="${g.id}" aria-label="Apagar ${esc(g.item)}">×</button>
  </li>`;
}

function totalsByKey(list, keyFn){
  const sums = {};
  list.forEach(g=>{
    const key = keyFn(g) || "Sem indicação";
    sums[key] = (sums[key]||0) + (Number(g.value)||0);
  });
  return Object.keys(sums).sort((a,b)=>a.localeCompare(b,"pt")).map(k=>({label:k, value:sums[k]}));
}
function totalRowsHtml(rows){
  return rows.length
    ? rows.map(r=>`<div class="buyer-row"><span>${esc(r.label)}</span><span>${formatEuro(r.value)}</span></div>`).join("")
    : `<p class="totals-empty">Sem valores.</p>`;
}

function renderGifts(){
  const recent = [...data.gifts].reverse();  // mais recentes primeiro, saldadas no fim
  const gifts = [...recent.filter(g=>!g.settled), ...recent.filter(g=>g.settled)];
  const settledCount = data.gifts.length - recent.filter(g=>!g.settled).length;
  $("#gift-count").textContent = `${settledCount} de ${data.gifts.length} saldadas`;
  $("#gift-bar").style.width = data.gifts.length ? (settledCount/data.gifts.length*100)+"%" : "0";
  $("#gifts-items").innerHTML = gifts.length
    ? `<ul class="task-list">${gifts.map(giftRow).join("")}</ul>`
    : `<div class="empty-note"><strong>Ainda não há prendas</strong>Usa o botão "Nova prenda" para começar.</div>`;

  const unsettled = data.gifts.filter(g=>!g.settled);
  $("#gifts-total").textContent = formatEuro(unsettled.reduce((sum,g)=>sum+(Number(g.value)||0), 0));
  $("#gifts-by-buyer").innerHTML = totalRowsHtml(totalsByKey(unsettled, g=>g.buyer));
  $("#gifts-by-giver").innerHTML = totalRowsHtml(totalsByKey(unsettled, g=>g.giver));
  const byCatHtml = GIFT_CATS.map(c=>{
    const inCat = unsettled.filter(g=>g.category===c.id);
    if(!inCat.length) return "";
    return `<div class="cat-group"><span class="cat-name">${c.label}</span>${totalRowsHtml(totalsByKey(inCat, g=>g.recipient))}</div>`;
  }).join("");
  $("#gifts-by-recipient").innerHTML = byCatHtml || `<p class="totals-empty">Sem valores.</p>`;
}

$("#gift-form").onsubmit = async e=>{
  e.preventDefault();
  const item = $("#g-item").value.trim();
  if(!item){ $("#g-item").classList.add("invalid"); $("#g-item").focus(); return; }
  $("#g-item").classList.remove("invalid");
  const payload = {
    item,
    recipient: $("#g-recipient").value.trim() || null,
    category: $("#g-cat").value,
    buyer: $("#g-buyer").value.trim() || null,
    giver: $("#g-giver").value.trim() || null,
    value: Math.max(0, Number($("#g-value").value) || 0)
  };
  $("#g-save").disabled = true;
  const ok = await insertRow("gifts", payload);
  $("#g-save").disabled = false;
  if(!ok) return;
  GIFT_FIELDS.forEach(f=>$(f).value="");
  renderGifts();
  showGiftsScreen("list");
};

$("#gifts-items").onclick = e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.settle){
    const g = data.gifts.find(x=>x.id===b.dataset.settle);
    g.settled = !g.settled;
    renderGifts(); updateRow("gifts", g.id, {settled:g.settled});
  } else if(b.dataset.gfdel){
    const g = data.gifts.find(x=>x.id===b.dataset.gfdel);
    if(!confirm(`Apagar ${g.item}?`)) return;
    data.gifts = data.gifts.filter(x=>x.id!==g.id);
    renderGifts(); deleteRow("gifts", g.id);
  }
};

try{
  const tab = localStorage.getItem("party-time-tab");
  if(VIEWS.includes(tab)) showView(tab);

/* ---------------- autenticação ---------------- */
function showLogin(msg){
  $("#app-content").classList.add("hidden");
  $("#top-actions").classList.add("hidden");
  $("#login-screen").classList.remove("hidden");
  const err = $("#login-error");
  if(msg){ err.textContent = msg; err.style.display = "block"; }
  else{ err.style.display = "none"; }
}
function showApp(){
  $("#login-screen").classList.add("hidden");
  $("#app-content").classList.remove("hidden");
  $("#top-actions").classList.remove("hidden");
  fetchAll();
}

$("#login-form").onsubmit = async e => {
  e.preventDefault();
  if(!supa){ showLogin("A ligação à base de dados não está disponível."); return; }
  const email = $("#login-user").value.trim();
  const password = $("#login-pass").value;
  if(!email || !password){ showLogin("Preenche o utilizador e a palavra-passe."); return; }
  $("#login-btn").disabled = true;
  const { error } = await supa.auth.signInWithPassword({ email, password });
  $("#login-btn").disabled = false;
  if(error){ showLogin("Não foi possível entrar: " + error.message); return; }
  showApp();
};

$("#logout-btn").onclick = async () => {
  if(supa) await supa.auth.signOut();
  data = emptyData();
  renderAll();
  showLogin();
};

// a lista é partilhada: ao voltar à app, carrega as alterações feitas por outras pessoas
document.addEventListener("visibilitychange", async () => {
  if(document.visibilityState!=="visible" || !supa || $("#app-content").classList.contains("hidden")) return;
  const { data:{session} } = await supa.auth.getSession();
  if(session) fetchAll();
});

if(supa){
  supa.auth.getSession().then(({data:{session}}) => { session ? showApp() : showLogin(); });
} else {
  showLogin("A ligação à base de dados não está disponível.");
}
</script>
